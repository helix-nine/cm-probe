name: Conflict Markers

# The live-docs backport (docs-backport.yml) commits a conflict with its markers
# intact so a maintainer settles it in the PR it opens, and GitHub reports that
# branch as mergeable. Prettier reaches only the files it formats, so this looks
# at every file a pull request changes.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conflict-markers:
    name: Conflict Markers
    # Draft pull requests are checked too, unlike the jobs in test.yaml: a branch
    # carrying markers should say so from its first push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check the changed files for conflict markers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          : "${BASE:?the pull request carried no base commit}"

          # git writes seven characters and then a label. `=======` is left out
          # because seven equals signs also underline a Markdown setext heading.
          MARKER='^(<{7}|>{7})( |$)'

          git diff -z --name-only --diff-filter=d "$BASE"...HEAD > /tmp/changed

          # Every book's docs/theme is a symlink to a directory, which grep
          # reports as an error unless it is told to skip directories.
          xargs -0 --no-run-if-empty \
            grep --line-number --with-filename --binary-files=without-match \
                 --directories=skip -E "$MARKER" -- \
            < /tmp/changed > /tmp/markers || true

          if [ ! -s /tmp/markers ]; then
            echo "No conflict markers in the files this pull request changes."
            exit 0
          fi

          cat /tmp/markers
          echo "::error::Conflict markers found in the diff — resolve them before merging."
          while IFS=: read -r file line _; do
            echo "::error file=$file,line=$line::Unresolved conflict marker."
          done < /tmp/markers
          exit 1
